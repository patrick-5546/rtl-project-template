name: Set up EDA tools
description: >-
  Build the pinned Verilator and slang that a job needs and put them on PATH: mise, which
  installs the other tools, has no build of them that the flow can use. Builds are cached by
  version and runner image. An empty version skips a tool.

inputs:
  verilator-version:
    description: Verilator Git tag to build, such as v5.054.
    default: ""
  slang-version:
    description: slang Git tag to build, such as v12.1.
    default: ""

runs:
  using: composite
  steps:
    # A build links against the image's libraries, so the caches are per OS image.
    # A job that restores a build skips its build step, so the build must not need
    # what that step installs. When a build step changes, change its cache key (for
    # Verilator, the build number), so that no job restores a build made the old way.
    - name: Identify the runner image
      id: image
      shell: bash
      run: echo "os=${ImageOS:-$RUNNER_OS}" >> "$GITHUB_OUTPUT"

    - name: Cache Verilator
      if: inputs.verilator-version != ''
      id: cache-verilator
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /opt/verilator
        key: verilator-${{ inputs.verilator-version }}-${{ steps.image.outputs.os }}-build2

    - name: Build Verilator
      if: inputs.verilator-version != '' && steps.cache-verilator.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERILATOR_VERSION: ${{ inputs.verilator-version }}
      run: |
        sudo apt-get update
        # Not ccache: configure records a ccache that it finds in verilated.mk, and
        # every model build then runs it, also in the jobs that restore this build.
        sudo apt-get install -y help2man libfl-dev
        git clone https://github.com/verilator/verilator --branch "$VERILATOR_VERSION" --depth 1 "$RUNNER_TEMP/verilator"
        cd "$RUNNER_TEMP/verilator"
        autoconf
        ./configure --prefix=/opt/verilator
        make -j"$(nproc)"
        make install

    - name: Add Verilator to PATH
      if: inputs.verilator-version != ''
      shell: bash
      run: echo "/opt/verilator/bin" >> "$GITHUB_PATH"

    - name: Cache slang
      if: inputs.slang-version != ''
      id: cache-slang
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /opt/slang
        key: slang-${{ inputs.slang-version }}-${{ steps.image.outputs.os }}

    - name: Build slang
      if: inputs.slang-version != '' && steps.cache-slang.outputs.cache-hit != 'true'
      shell: bash
      env:
        SLANG_VERSION: ${{ inputs.slang-version }}
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake python3
        git clone https://github.com/MikePopoloski/slang --branch "$SLANG_VERSION" --depth 1 "$RUNNER_TEMP/slang"
        cd "$RUNNER_TEMP/slang"
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/opt/slang -DSLANG_INCLUDE_TESTS=OFF
        cmake --build build -j 2
        cmake --install build

    - name: Add slang to PATH
      if: inputs.slang-version != ''
      shell: bash
      run: echo "/opt/slang/bin" >> "$GITHUB_PATH"
