name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request supersedes its run in progress; runs on main all finish.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fail instead of updating uv.lock, including in the uv runs that make starts.
  UV_LOCKED: "1"
  # The EDA tools, pinned; bump a version with its archive's SHA-256 (docs/development.md).
  VERILATOR_VERSION: v5.048
  SLANG_VERSION: v10.0
  VERIBLE_VERSION: v0.0-4053-g89d4d98a
  VERIBLE_SHA256: 1edc1f29c70d74213ed373e727183802d5a733e23f9ab9c74462f5b18b76f2c0
  LCOV_VERSION: v2.4
  LCOV_SHA256: 3457825c6b2fe4ef77c782b82a23875c84a3c955243823f05d8f2dec0d455820

jobs:
  lint:
    name: Lint Python and Markdown, and check spelling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install the locked Python packages
        run: uv sync
      - run: make lint-py lint-md lint-spell

  lint-sv:
    name: Lint SystemVerilog
    runs-on: ubuntu-24.04
    # Building Verilator and slang when they are not cached takes about 15 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-eda-tools
        with:
          verilator-version: ${{ env.VERILATOR_VERSION }}
          slang-version: ${{ env.SLANG_VERSION }}
          verible-version: ${{ env.VERIBLE_VERSION }}
          verible-sha256: ${{ env.VERIBLE_SHA256 }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install the locked Python packages
        run: uv sync
      - run: make lint-sv

  flow-tests:
    name: Flow tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install the locked Python packages
        run: uv sync
      - run: make test-flow-py

  rtl:
    name: RTL ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tests
            target: test
            waves: "0"
          - name: tests with waveforms
            target: test
            waves: "1"
          - name: coverage
            target: coverage
            waves: "0"
    runs-on: ubuntu-24.04
    # Building Verilator when it is not cached takes about 10 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-eda-tools
        with:
          verilator-version: ${{ env.VERILATOR_VERSION }}
          lcov-version: ${{ matrix.target == 'coverage' && env.LCOV_VERSION || '' }}
          lcov-sha256: ${{ env.LCOV_SHA256 }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install the locked Python packages
        run: uv sync
      - name: Run make ${{ matrix.target }} for every DUT
        env:
          TARGET: ${{ matrix.target }}
          WAVES: ${{ matrix.waves }}
        run: make "$TARGET" DUT=all WAVES="$WAVES"
