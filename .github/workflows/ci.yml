name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request supersedes its run in progress; runs on main all finish.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fail instead of updating uv.lock, including in the uv runs that make starts.
  UV_LOCKED: "1"
  # The pinned version of mise, which installs the tools that mise.lock pins
  # (docs/flow/development.md).
  MISE_VERSION: 2026.11.1

jobs:
  lint:
    name: Lint Python, Markdown, spelling and workflows
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # These checks need only uv and GNU Make of the tools that mise.lock pins.
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: uv make
      - name: Install the locked Python packages
        run: uv sync
      - name: Lint
        env:
          # zizmor's online audits check the pinned actions against GitHub.
          GH_TOKEN: ${{ github.token }}
        run: make lint-py lint-md lint-spell lint-gha

  lint-sv:
    name: Lint SystemVerilog
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the tools that mise.lock pins: Verible, and OSS CAD Suite's Verilator and slang.
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: ${{ env.MISE_VERSION }}
      - name: Install the locked Python packages
        run: uv sync
      - run: make lint-sv

  flow-tests:
    name: Flow tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The flow's tests mock the EDA tools, so they need only uv and GNU Make.
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: uv make
      - name: Install the locked Python packages
        run: uv sync
      - run: make test-flow-py

  rtl:
    name: RTL ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tests
            target: test
            waves: "0"
          - name: tests with waveforms
            target: test
            waves: "1"
          - name: coverage
            target: coverage
            waves: "0"
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Perl modules that LCOV loads
        if: matrix.target == 'coverage'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcapture-tiny-perl libdatetime-perl libdevel-stacktrace-perl libtimedate-perl
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: ${{ env.MISE_VERSION }}
      - name: Install the locked Python packages
        run: uv sync
      - name: Run make ${{ matrix.target }} for every DUT
        env:
          TARGET: ${{ matrix.target }}
          WAVES: ${{ matrix.waves }}
          COVERAGE_HTML: ${{ matrix.target == 'coverage' && '1' || '0' }}
        run: make "$TARGET" WAVES="$WAVES"
      # Coverage reports are written even when tests fail, so these run after a failure too.
      # verilator_coverage summarizes each type apart; LCOV would count covergroup bins as
      # lines and branches.
      - name: Summarize the coverage
        if: ${{ !cancelled() && matrix.target == 'coverage' }}
        run: |
          shopt -s nullglob
          data=(build/*/verilator/*/coverage/coverage.dat)
          {
            echo "## Coverage"
            if [ "${#data[@]}" -eq 0 ]; then
              echo "No coverage data was written."
            fi
            for dat in "${data[@]}"; do
              config_dir=${dat%/coverage/coverage.dat}
              dut=${config_dir#build/}
              echo "### ${dut%%/*}.${config_dir##*/}"
              echo '```text'
              verilator_coverage --report summary "$dat" 2>&1
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the coverage reports
        if: ${{ !cancelled() && matrix.target == 'coverage' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: |
            build/*/verilator/*/coverage/coverage_html/
            build/*/verilator/*/coverage/coverage.info
          if-no-files-found: error

  rtl-macos:
    name: RTL coverage with waveforms on macOS
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install lz4, which Verilator's FST waveforms link
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install lz4
      # LCOV runs the first perl on PATH, and the runner's Homebrew Perl lacks the modules that
      # LCOV loads, which macOS's own Perl has.
      - name: Put macOS's own Perl first on PATH
        run: |
          mkdir "$RUNNER_TEMP/macos-perl"
          ln -s /usr/bin/perl "$RUNNER_TEMP/macos-perl/perl"
          echo "$RUNNER_TEMP/macos-perl" >> "$GITHUB_PATH"
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: ${{ env.MISE_VERSION }}
      - name: Install the locked Python packages
        run: uv sync
      # One run covers what differs on macOS: Apple's compiler, Homebrew's lz4, and LCOV.
      - run: make coverage WAVES=1 COVERAGE_HTML=1
