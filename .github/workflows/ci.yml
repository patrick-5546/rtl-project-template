name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request supersedes its run in progress; runs on main all finish.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fail instead of updating uv.lock, including in the uv runs that make starts.
  UV_LOCKED: "1"
  # The EDA tools, pinned; bump a version with its archive's SHA-256 (docs/flow/development.md).
  VERILATOR_VERSION: v5.054
  SLANG_VERSION: v12.1
  VERIBLE_VERSION: v0.0-4298-g085eef05
  VERIBLE_SHA256: ca83778c7c2b73272277bd670d1851c8caf973fd3283688aeb0d36d4b3598a90
  LCOV_VERSION: v2.6
  LCOV_SHA256: 67a45db99b8ef0260c3fac9a2e3749fd8fa350a15e235dd3c29b356d97755c75

jobs:
  lint:
    name: Lint Python, Markdown, spelling and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install the locked Python packages
        run: uv sync
      - name: Lint
        env:
          # zizmor's online audits check the pinned actions against GitHub.
          GH_TOKEN: ${{ github.token }}
        run: make lint-py lint-md lint-spell lint-gha

  lint-sv:
    name: Lint SystemVerilog
    runs-on: ubuntu-24.04
    # Building Verilator and slang when they are not cached takes about 15 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-eda-tools
        with:
          verilator-version: ${{ env.VERILATOR_VERSION }}
          slang-version: ${{ env.SLANG_VERSION }}
          verible-version: ${{ env.VERIBLE_VERSION }}
          verible-sha256: ${{ env.VERIBLE_SHA256 }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install the locked Python packages
        run: uv sync
      - run: make lint-sv

  flow-tests:
    name: Flow tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install the locked Python packages
        run: uv sync
      - run: make test-flow-py

  rtl:
    name: RTL ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tests
            target: test
            waves: "0"
          - name: tests with waveforms
            target: test
            waves: "1"
          - name: coverage
            target: coverage
            waves: "0"
    runs-on: ubuntu-24.04
    # Building Verilator when it is not cached takes about 10 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-eda-tools
        with:
          verilator-version: ${{ env.VERILATOR_VERSION }}
          lcov-version: ${{ matrix.target == 'coverage' && env.LCOV_VERSION || '' }}
          lcov-sha256: ${{ env.LCOV_SHA256 }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install the locked Python packages
        run: uv sync
      - name: Run make ${{ matrix.target }} for every DUT
        env:
          TARGET: ${{ matrix.target }}
          WAVES: ${{ matrix.waves }}
          COVERAGE_HTML: ${{ matrix.target == 'coverage' && '1' || '0' }}
        run: make "$TARGET" WAVES="$WAVES"
      # Coverage reports are written even when tests fail, so these run after a failure too.
      # verilator_coverage summarizes each type apart; LCOV would count covergroup bins as
      # lines and branches.
      - name: Summarize the coverage
        if: ${{ !cancelled() && matrix.target == 'coverage' }}
        run: |
          shopt -s nullglob
          data=(build/*/verilator/*/coverage/coverage.dat)
          {
            echo "## Coverage"
            if [ "${#data[@]}" -eq 0 ]; then
              echo "No coverage data was written."
            fi
            for dat in "${data[@]}"; do
              config_dir=${dat%/coverage/coverage.dat}
              dut=${config_dir#build/}
              echo "### ${dut%%/*}.${config_dir##*/}"
              echo '```text'
              verilator_coverage --report summary "$dat" 2>&1
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the coverage reports
        if: ${{ !cancelled() && matrix.target == 'coverage' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: |
            build/*/verilator/*/coverage/coverage_html/
            build/*/verilator/*/coverage/coverage.info
          if-no-files-found: error
