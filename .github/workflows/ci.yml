name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request supersedes its run in progress; runs on main all finish.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fail instead of updating uv.lock, including in the uv runs that make starts.
  UV_LOCKED: "1"
  # The versions of the EDA tools that CI builds, and of mise, which installs the tools
  # that mise.lock pins; docs/flow/development.md says how to bump them.
  VERILATOR_VERSION: v5.054
  SLANG_VERSION: v12.1
  MISE_VERSION: 2026.11.1

jobs:
  lint:
    name: Lint Python, Markdown, spelling and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the tools that mise.lock pins, uv among them, and puts them on PATH.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: ${{ env.MISE_VERSION }}
      - name: Install the locked Python packages
        run: uv sync
      - name: Lint
        env:
          # zizmor's online audits check the pinned actions against GitHub.
          GH_TOKEN: ${{ github.token }}
        run: make lint-py lint-md lint-spell lint-gha

  lint-sv:
    name: Lint SystemVerilog
    runs-on: ubuntu-24.04
    # Building Verilator and slang when they are not cached takes about 15 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-eda-tools
        with:
          verilator-version: ${{ env.VERILATOR_VERSION }}
          slang-version: ${{ env.SLANG_VERSION }}
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: ${{ env.MISE_VERSION }}
      - name: Install the locked Python packages
        run: uv sync
      - run: make lint-sv

  flow-tests:
    name: Flow tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: ${{ env.MISE_VERSION }}
      - name: Install the locked Python packages
        run: uv sync
      - run: make test-flow-py

  rtl:
    name: RTL ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tests
            target: test
            waves: "0"
          - name: tests with waveforms
            target: test
            waves: "1"
          - name: coverage
            target: coverage
            waves: "0"
    runs-on: ubuntu-24.04
    # Building Verilator when it is not cached takes about 10 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-eda-tools
        with:
          verilator-version: ${{ env.VERILATOR_VERSION }}
      - name: Install the Perl modules that LCOV loads
        if: matrix.target == 'coverage'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcapture-tiny-perl libdatetime-perl libdevel-stacktrace-perl libtimedate-perl
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: ${{ env.MISE_VERSION }}
      - name: Install the locked Python packages
        run: uv sync
      - name: Run make ${{ matrix.target }} for every DUT
        env:
          TARGET: ${{ matrix.target }}
          WAVES: ${{ matrix.waves }}
          COVERAGE_HTML: ${{ matrix.target == 'coverage' && '1' || '0' }}
        run: make "$TARGET" WAVES="$WAVES"
      # Coverage reports are written even when tests fail, so these run after a failure too.
      # verilator_coverage summarizes each type apart; LCOV would count covergroup bins as
      # lines and branches.
      - name: Summarize the coverage
        if: ${{ !cancelled() && matrix.target == 'coverage' }}
        run: |
          shopt -s nullglob
          data=(build/*/verilator/*/coverage/coverage.dat)
          {
            echo "## Coverage"
            if [ "${#data[@]}" -eq 0 ]; then
              echo "No coverage data was written."
            fi
            for dat in "${data[@]}"; do
              config_dir=${dat%/coverage/coverage.dat}
              dut=${config_dir#build/}
              echo "### ${dut%%/*}.${config_dir##*/}"
              echo '```text'
              verilator_coverage --report summary "$dat" 2>&1
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the coverage reports
        if: ${{ !cancelled() && matrix.target == 'coverage' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: |
            build/*/verilator/*/coverage/coverage_html/
            build/*/verilator/*/coverage/coverage.info
          if-no-files-found: error
