[project]
name = "rtl-project-template"
version = "0.1.0"
description = "A SystemVerilog RTL project template (cocotb, Verilator/Questa/VCS, lint, coverage, waveforms) for agentic development"
requires-python = ">=3.14,<3.15"
dependencies = [
    "cocotb>=2.1.0",
    "cocotb-coverage>=2.0.0",
    "pytest>=9.0.3",
]

[dependency-groups]
dev = [
    "pyrefly>=1.1.1",
    "ruff>=0.15.20",
    "rumdl>=0.3.2",
    "ty>=0.0.56",
]

[tool.uv]
package = false
# Lock only releases at least a week old, as Dependabot's cooldown waits for: most
# compromised releases are found and pulled within days.
exclude-newer = "7 days"

[tool.pytest]
minversion = "9.1"
strict = true
addopts = ["-ra"]
testpaths = ["tests"]
pythonpath = [".", "tests"]
filterwarnings = ["error"]

[tool.pyrefly]
preset = "strict"
search-path = [".", "tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = [
    "ANN",
    "B",
    "C4",
    "E501",
    "FURB",
    "I",
    "PERF",
    "PGH",
    "PIE",
    "PLW1514",
    "PT",
    "PTH",
    "PYI",
    "RET",
    "RUF",
    "SIM",
    "UP",
]
# Rule codes, which other tools and the docs use, rather than rule names.
ignore = ["RUF201"]
preview = true

[tool.ruff.lint.per-file-ignores]
# cocotb's `dut` handle is dynamically typed; `Any` is the pragmatic annotation
# (concrete handle types lack the runtime signal attributes), so allow it here.
# cocotb runs every test as a coroutine, including ones that never await.
"tests/**" = ["ANN401", "RUF029"]

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"

[tool.rumdl.MD013]
line-length = 100
