[project]
name = "rtl-project-template"
version = "0.1.0"
description = "A SystemVerilog RTL project template (cocotb, Verilator/Questa/VCS, lint, coverage, waveforms) for agentic development"
requires-python = ">=3.14,<3.15"
dependencies = [
    "cocotb>=2.1.0",
    "cocotb-coverage>=2.0.0",
    "pytest>=9.0.3",
]

[dependency-groups]
dev = [
    "pyrefly>=1.1.1",
    "ruff>=0.15.20",
    "ty>=0.0.56",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = ["-ra"]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.pyrefly]
preset = "strict"
search-path = [".", "tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["B", "E501", "I", "SIM", "UP", "ANN", "PYI"]
preview = true

[tool.ruff.lint.per-file-ignores]
# cocotb's `dut` handle is dynamically typed; `Any` is the pragmatic annotation
# (concrete handle types lack the runtime signal attributes), so allow it here.
"tests/**" = ["ANN401"]

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
