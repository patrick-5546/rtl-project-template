# The tools that mise installs for the flow, locally and in CI: see
# docs/flow/tools.md, and docs/flow/development.md to update them.
min_version = "2026.11.1"

[settings]
# Upgrade only to releases at least a week old, as uv.lock and Dependabot do.
minimum_release_age = "7d"
# The platforms that mise.lock has downloads for. To set up another kind of
# machine, add its platform and run `mise lock`.
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64"]

[tools]
uv = "0.13.7"
"github:chipsalliance/verible" = "0.0-4298-g085eef05"
# The source tarball, which runs as it is, not the release's RPMs; only genhtml
# and lcov, not its helper scripts, go on PATH.
"github:linux-test-project/lcov" = { version = "2.6", asset_pattern = "lcov-*.tar.gz", filter_bins = ["genhtml", "lcov"] }
# GNU Make, since macOS's own is too old for the Makefile.
make = "4.4.1"
# OSS CAD Suite: Verilator, slang and GTKWave, among other tools, with the
# libraries that they need. It releases daily, named by date; each release is a
# 0.5 to 0.7 GB download. Only the commands that the flow runs go on PATH: add
# another of the suite's to filter_bins to use it.
"github:YosysHQ/oss-cad-suite-build" = { version = "2026-11-16", filter_bins = ["verilator", "verilator_coverage", "slang", "slang-tidy", "gtkwave", "rtlbrowse"] }
